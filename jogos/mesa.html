<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SENTA A CARIMBADA, camarada! · escolha o tema</title>
<link rel="stylesheet" href="./carimbo.css">
</head>
<body>
<div class="game-navbar">
    <a class="back-link" href="../index.html">&larr; início</a>
    <span class="game-navbar-title">SENTA A CARIMBADA, <span class="camarada">camarada!</span></span>
    <div class="navbar-fases">
      <button class="chrome-toggle" id="chromeToggle" onclick="alternarFases()">fases</button>
      <div class="fases-dropdown" id="fasesDropdown">
        <nav class="fases" id="fasesNav"></nav>
      </div>
    </div>
</div>
<div class="desk">
<div class="desk-game">
<div class="wrap">
  <header>
    <div class="eyebrow">senta a carimbada, camarada!</div>
    <h1>Escolha o <span class="camarada">tema!</span></h1>
    <div class="sub">Cada dossiê é uma lei. Abra pra ver as fases dentro.</div>
  </header>

  <div class="mesa-dossies" id="mesaDossies"></div>
</div>
  <div class="foot">O progresso de cada fase fica salvo só neste navegador.</div>
</div>
</div>

<button class="music-btn" id="musicaBtn" onclick="alternarMusica()" aria-pressed="false">tocar música</button>
<script src="./progresso.js"></script>
<script src="./musica.js"></script>
<script>
function alternarFases(){
  const dd=document.getElementById('fasesDropdown');
  if(dd) dd.classList.toggle('show');
}
document.addEventListener('click', e=>{
  const dd=document.getElementById('fasesDropdown');
  const btn=document.getElementById('chromeToggle');
  if(dd && dd.classList.contains('show') && !dd.contains(e.target) && e.target!==btn){
    dd.classList.remove('show');
  }
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ const dd=document.getElementById('fasesDropdown'); if(dd) dd.classList.remove('show'); }
});

const $=id=>document.getElementById(id);

function fmtData(iso){
  const d=new Date(iso);
  return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'});
}

function renderizarMesa(){
  const todos = carimboLerProgresso();
  $('mesaDossies').innerHTML = CARIMBO_TEMAS.map(tema=>{
    const jogadas = tema.fases.filter(f=>todos[f.id]);
    const mediaPct = jogadas.length ? Math.round(jogadas.reduce((s,f)=>s+todos[f.id].pct,0)/jogadas.length) : 0;
    const resumo = jogadas.length
      ? `${jogadas.length}/${tema.fases.length} fases · ${mediaPct}% média`
      : `${tema.fases.length} fase${tema.fases.length>1?'s':''}`;

    const linhas = tema.fases.map(f=>{
      const p = todos[f.id];
      if(!p){
        return `<a class="progress-item empty" href="${f.href}">
          <span class="p-name">${f.nome}</span>
          <span class="p-status">ainda não jogado</span>
        </a>`;
      }
      return `<a class="progress-item" href="${f.href}">
        <span class="p-name">${f.nome}</span>
        <span class="progress-bar-track"><span class="progress-bar-fill" style="width:${p.pct}%"></span></span>
        <span class="p-status"><b>${p.correct}/${p.total}</b> (${p.pct}%) · ${fmtData(p.data)}</span>
      </a>`;
    }).join('');

    return `
      <div class="dossie" data-tema="${tema.id}" id="dossie-${tema.id}">
        <button class="dossie-head" onclick="toggleDossie('${tema.id}')">
          <span class="dossie-nome">${tema.nome}</span>
          <span class="dossie-sub">${tema.subtitulo}</span>
          <span class="dossie-progresso">${resumo}</span>
        </button>
        <div class="dossie-fases progress-list">${linhas}</div>
      </div>
    `;
  }).join('');
}

function toggleDossie(temaId){
  const el = document.getElementById('dossie-'+temaId);
  if(!el) return;
  const abrindo = !el.classList.contains('open');
  document.querySelectorAll('.dossie.open').forEach(d=>{ if(d!==el) d.classList.remove('open'); });
  el.classList.toggle('open', abrindo);
}

carimboRenderizarDropdownGeral('mesa');
renderizarMesa();
if(CARIMBO_TEMAS[0]) toggleDossie(CARIMBO_TEMAS[0].id);
</script>
</body>
</html>
