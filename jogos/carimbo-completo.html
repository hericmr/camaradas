<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SENTA A CARIMBADA, camarada! · fase 3 (tudo junto)</title>
<link rel="stylesheet" href="./carimbo.css">
<style>
  .stamp-btn{padding:13px 8px}
  .stamp-btn .nat{font-size:16px}

  .stamp-btn.principio{border-color:var(--seal-blue);color:var(--seal-blue-ink)}
  .stamp-btn.principio:hover{background:rgba(47,95,122,.08)}
  .stamp-btn.direito{border-color:var(--seal-green);color:var(--seal-green-ink)}
  .stamp-btn.direito:hover{background:rgba(47,107,79,.08)}
  .stamp-btn.dever{border-color:var(--seal-gold);color:var(--seal-gold-ink)}
  .stamp-btn.dever:hover{background:rgba(168,132,60,.1)}
  .stamp-btn.vedacao{border-color:var(--seal-red);color:var(--seal-red-ink)}
  .stamp-btn.vedacao:hover{background:rgba(168,50,42,.08)}
  .stamp-btn.competencia{border-color:var(--seal-purple);color:var(--seal-purple-ink)}
  .stamp-btn.competencia:hover{background:rgba(107,76,140,.08)}
  .stamp-btn.atribuicao{border-color:var(--seal-rust);color:var(--seal-rust-ink)}
  .stamp-btn.atribuicao:hover{background:rgba(161,90,42,.08)}

  .seal.principio{color:var(--seal-blue)}
  .seal.direito{color:var(--seal-green)}
  .seal.dever{color:var(--seal-gold)}
  .seal.vedacao{color:var(--seal-red)}
  .seal.competencia{color:var(--seal-purple)}
  .seal.atribuicao{color:var(--seal-rust)}
</style>
</head>
<body class="bg-3">
  <div class="game-navbar">
    <a class="back-link" href="../index.html">&larr; início</a>
    <span class="game-navbar-title">SENTA A CARIMBADA, <span class="camarada">camarada!</span></span>
    <div class="navbar-fases">
      <button class="chrome-toggle" id="chromeToggle" onclick="alternarFases()">fases</button>
      <div class="fases-dropdown" id="fasesDropdown">
        <div class="dropdown-actions">
          <button class="dropdown-action" id="musicaBtn" onclick="alternarMusica()" aria-pressed="false">tocar música</button>
          <button class="dropdown-action" id="manualBtn" onclick="alternarManual()">consultar a lei</button>
        </div>
        <nav class="fases" id="fasesNav"></nav>
      </div>
    </div>
  </div>
<div class="desk">
<div class="desk-game">
<div class="wrap">
  <!-- ===== MODO JOGO ===== -->
  <section class="stage" id="playStage">
    <div class="card" id="card" data-label="TUDO JUNTO">
      <div class="doc-label" id="docLabel">Documento nº 1: classifique a atividade</div>
      <div class="activity" id="activity">…</div>

      <div class="carimbador-row">
        <div class="hud-side">
          <div class="stat"><div class="k">Acertos</div><div class="v" id="hCorrect">0</div></div>
          <div class="stat streak"><div class="k">Sequência</div><div class="v" id="hStreak">0</div></div>
        </div>
        <img class="carimbador" id="carimbador" src="../img/carimbo/01.png" alt="assistente social de carimbo em punho, pronto para julgar">
        <div class="hud-side">
          <div class="stat"><div class="k">Rodada</div><div class="v" id="hProg">0/0</div></div>
          <div class="stat"><div class="k">Recorde</div><div class="v" id="hBest">0</div></div>
        </div>
      </div>

      <div class="seal principio" id="sealPrincipio">Princípio</div>
      <div class="seal direito" id="sealDireito">Direito</div>
      <div class="seal dever" id="sealDever">Dever</div>
      <div class="seal vedacao" id="sealVedacao">Vedação</div>
      <div class="seal competencia" id="sealCompetencia">Competência</div>
      <div class="seal atribuicao" id="sealAtribuicao">Atribuição</div>

      <div class="verdict c3">
        <button class="stamp-btn principio" id="btnPrincipio" onclick="judge('principio')"><span class="nat">Princípio</span></button>
        <button class="stamp-btn direito" id="btnDireito" onclick="judge('direito')"><span class="nat">Direito</span></button>
        <button class="stamp-btn dever" id="btnDever" onclick="judge('dever')"><span class="nat">Dever</span></button>
        <button class="stamp-btn vedacao" id="btnVedacao" onclick="judge('vedacao')"><span class="nat">Vedação</span></button>
        <button class="stamp-btn competencia" id="btnCompetencia" onclick="judge('competencia')"><span class="nat">Competência</span></button>
        <button class="stamp-btn atribuicao" id="btnAtribuicao" onclick="judge('atribuicao')"><span class="nat">Atribuição</span></button>
      </div>

      <div class="feedback" id="feedback">
        <div class="verdict-line" id="vLine"></div>
        <div class="cite" id="cite"></div>
      </div>
    </div>
  </section>
</div>
  <div class="foot">Fontes: <a href="https://www.cfess.org.br/arquivos/CEP_CFESS-SITE.pdf" target="_blank" rel="noopener">Código de Ética do/a Assistente Social (Resolução CFESS nº 273/93)</a> e <a href="https://www.planalto.gov.br/ccivil_03/leis/L8662.htm" target="_blank" rel="noopener">Lei nº 8.662, de 7 de junho de 1993</a></div>
</div>

<script src="./progresso.js"></script>
<script src="./musica.js"></script>
<script>
let DATA = null;
carimboRenderizarDropdownFase('completo');

const NAT = {
  principio: {label:'Princípio', explica:'é um dos <b>princípios fundamentais</b> do Código de Ética.'},
  direito: {label:'Direito', explica:'é um <b>direito</b> do/a assistente social (Código de Ética).'},
  dever: {label:'Dever', explica:'é um <b>dever</b> do/a assistente social (Código de Ética).'},
  vedacao: {label:'Vedação', explica:'é uma <b>vedação</b> (Código de Ética).'},
  competencia: {label:'Competência', explica:'é uma <b>competência</b> compartilhada (Lei 8.662, art. 4º).'},
  atribuicao: {label:'Atribuição', explica:'é uma <b>atribuição privativa</b> (Lei 8.662, art. 5º).'}
};
const SEAL_ID = {principio:'sealPrincipio', direito:'sealDireito', dever:'sealDever', vedacao:'sealVedacao', competencia:'sealCompetencia', atribuicao:'sealAtribuicao'};
const BTN_ID = {principio:'btnPrincipio', direito:'btnDireito', dever:'btnDever', vedacao:'btnVedacao', competencia:'btnCompetencia', atribuicao:'btnAtribuicao'};

/* ---------- monta o baralho ---------- */
function buildDeck(){
  const deck=[];

  DATA.principios.forEach(p=>{
    deck.push({categoria:'principio', ref:`princípio ${p.num}`, texto:p.texto});
  });

  Object.values(DATA.artigosEtica).forEach(a=>{
    if(!['direito','dever','vedacao'].includes(a.natureza)) return;
    if(a.alineas && a.alineas.length){
      a.alineas.forEach(al=>{
        deck.push({categoria:a.natureza, ref:`art. ${a.num}, alínea ${al.letra}`, texto:al.texto});
      });
    } else {
      deck.push({categoria:a.natureza, ref:`art. ${a.num}`, texto:a.caput});
    }
  });

  DATA.lei8662.art_4.incisos.forEach(i=>{
    if(!i.vetado) deck.push({categoria:'competencia', ref:`Lei 8.662, art. 4º, inciso ${i.num}`, texto:i.texto});
  });
  DATA.lei8662.art_5.incisos.forEach(i=>{
    deck.push({categoria:'atribuicao', ref:`Lei 8.662, art. 5º, inciso ${i.num}`, texto:i.texto});
  });

  return deck;
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

let deck=[], idx=0, correct=0, streak=0, best=0, answered=false, missed=[];

const $=id=>document.getElementById(id);

const sndStamp=new Audio('../stamp.mp3');
const sndCorrect=new Audio('../correct.mp3');
const sndWrong=new Audio('../wrong.mp3');
function playSound(a){
  try{ a.currentTime=0; a.play().catch(()=>{}); }catch(e){}
}

/* ---------- avanço automático ---------- */
let autoAdvanceTimer=null;
let spaceAdvanceActive=false;

document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ fecharManual(); const dd=document.getElementById('fasesDropdown'); if(dd) dd.classList.remove('show'); return; }
  const tag=(e.target&&e.target.tagName)||'';
  if(tag==='INPUT' || tag==='TEXTAREA') return;
  if(e.code==='Space' || e.key===' '){
    if(spaceAdvanceActive){
      e.preventDefault();
      avancarQuestao();
    }
  }
});

function agendarProximo(){
  cancelarAutoAvanco();
  const fill=$('nextFill');
  if(fill){
    fill.classList.remove('run');
    void fill.offsetWidth;
    fill.classList.add('run');
  }
  spaceAdvanceActive=true;
  autoAdvanceTimer=setTimeout(avancarQuestao, 3000);
}

function cancelarAutoAvanco(){
  if(autoAdvanceTimer){ clearTimeout(autoAdvanceTimer); autoAdvanceTimer=null; }
  spaceAdvanceActive=false;
  const fill=$('nextFill');
  if(fill) fill.classList.remove('run');
}

function avancarQuestao(){
  cancelarAutoAvanco();
  nextCard();
}

function startRound(){
  cancelarAutoAvanco();
  deck=shuffle(buildDeck());
  idx=0; correct=0; streak=0; answered=false; missed=[];
  renderCard(); updateHud();
}

function renderCard(){
  answered=false;
  const c=deck[idx];
  $('card').innerHTML=cardTemplate();
  bindCard();
  $('docLabel').textContent=`Documento nº ${idx+1}: classifique a atividade`;
  $('activity').innerHTML=`<span class="qnum">“</span>${c.texto}<span class="qnum">”</span>`;
  updateHud();
}

function cardTemplate(){
  return `
    <div class="doc-label" id="docLabel"></div>
    <div class="activity" id="activity"></div>
    <div class="carimbador-row">
      <div class="hud-side">
        <div class="stat"><div class="k">Acertos</div><div class="v" id="hCorrect">0</div></div>
        <div class="stat streak"><div class="k">Sequência</div><div class="v" id="hStreak">0</div></div>
      </div>
      <img class="carimbador" id="carimbador" src="../img/carimbo/01.png" alt="assistente social de carimbo em punho, pronto para julgar">
      <div class="hud-side">
        <div class="stat"><div class="k">Rodada</div><div class="v" id="hProg">0/0</div></div>
        <div class="stat"><div class="k">Recorde</div><div class="v" id="hBest">0</div></div>
      </div>
    </div>
    <div class="seal principio" id="sealPrincipio">Princípio</div>
    <div class="seal direito" id="sealDireito">Direito</div>
    <div class="seal dever" id="sealDever">Dever</div>
    <div class="seal vedacao" id="sealVedacao">Vedação</div>
    <div class="seal competencia" id="sealCompetencia">Competência</div>
    <div class="seal atribuicao" id="sealAtribuicao">Atribuição</div>
    <div class="verdict c3">
      <button class="stamp-btn principio" id="btnPrincipio"><span class="nat">Princípio</span></button>
      <button class="stamp-btn direito" id="btnDireito"><span class="nat">Direito</span></button>
      <button class="stamp-btn dever" id="btnDever"><span class="nat">Dever</span></button>
      <button class="stamp-btn vedacao" id="btnVedacao"><span class="nat">Vedação</span></button>
      <button class="stamp-btn competencia" id="btnCompetencia"><span class="nat">Competência</span></button>
      <button class="stamp-btn atribuicao" id="btnAtribuicao"><span class="nat">Atribuição</span></button>
    </div>
    <div class="feedback" id="feedback">
      <div class="verdict-line" id="vLine"></div>
      <div class="cite" id="cite"></div>
    </div>`;
}
function bindCard(){
  Object.keys(NAT).forEach(cat=>{ $(BTN_ID[cat]).onclick=()=>judge(cat); });
}

function judge(choice){
  if(answered) return;
  answered=true;
  playSound(sndStamp);
  const c=deck[idx];
  const right = choice===c.categoria;
  const info = NAT[c.categoria];

  // estampa o selo correto
  $(SEAL_ID[c.categoria]).classList.add('show');

  // bate o carimbo
  const carimbador=$('carimbador');
  carimbador.src='../img/carimbo/02.png';
  carimbador.classList.add('hit');
  setTimeout(()=>carimbador.classList.remove('hit'),150);

  if(right){ correct++; streak++; if(streak>best){best=streak;} playSound(sndCorrect); }
  else { streak=0; missed.push({ref:c.ref, texto:c.texto, explica:info.explica}); playSound(sndWrong); }

  const rotuloProximo = idx>=deck.length-1 ? 'Ver resultado →' : 'Próximo →';
  Object.keys(BTN_ID).forEach(cat=>{
    const btn=$(BTN_ID[cat]);
    if(cat===choice){
      btn.disabled=false;
      btn.classList.add('next-here');
      btn.onclick=avancarQuestao;
      btn.innerHTML=`<span class="next-fill" id="nextFill"></span><span class="next-label">${rotuloProximo}</span>`;
    } else {
      btn.disabled=true;
    }
  });

  const fb=$('feedback');
  const vLine=$('vLine');
  const cite=$('cite');
  vLine.className='verdict-line '+(right?'ok':'no');
  vLine.textContent = right ? '✓ Carimbo correto' : '✗ Carimbo errado';
  cite.innerHTML = `${c.ref}: ${info.explica}`;
  fb.classList.add('show');
  updateHud();

  agendarProximo();
}

function nextCard(){
  if(idx>=deck.length-1){ showDone(); return; }
  idx++; renderCard();
}

function updateHud(){
  $('hCorrect').textContent=correct;
  $('hProg').textContent=`${Math.min(idx+ (answered?1:0),deck.length)}/${deck.length}`;
  $('hStreak').textContent=streak;
  $('hBest').textContent=best;
}

function reviewHtml(){
  if(!missed.length) return '';
  return `<div class="review">
    <h3>Revise o que errou (${missed.length})</h3>
    <ul>${missed.map(m=>`<li><div class="r-cite">${m.ref}: ${m.explica}</div><div class="r-txt">“${m.texto}”</div></li>`).join('')}</ul>
  </div>`;
}

function showDone(){
  const pct=Math.round(correct/deck.length*100);
  carimboSalvarProgresso('completo', correct, deck.length, best);
  let msg;
  if(pct===100) msg="Gabaritou. Você domina tudo: princípios, direitos, deveres, vedações, competências e atribuições.";
  else if(pct>=80) msg="Sólido. Revise só o que escapou.";
  else if(pct>=60) msg="Quase lá. Revise os errados abaixo e tente de novo.";
  else msg="Revise os errados abaixo antes de tentar de novo.";
  $('playStage').innerHTML=`
    <div class="card"><div class="done">
      <div class="score-big">${correct}/${deck.length}</div>
      <h2>${pct}% de acerto</h2>
      <p>${msg}${best>1?`<br>Melhor sequência: ${best} seguidos.`:''}</p>
      <button onclick="restart()">Nova rodada</button>
    </div>${reviewHtml()}</div>`;
}
function restart(){
  $('playStage').innerHTML=`<div class="card" id="card" data-label="TUDO JUNTO"></div>`;
  startRound();
}

/* ---------- paineis dock: manual (lei seca) e fases ---------- */
function isDocked(){
  return window.matchMedia('(min-width:1100px)').matches;
}
function estaAberto(id){
  const ov=document.getElementById(id);
  if(!ov) return false;
  return isDocked() ? !ov.classList.contains('collapsed') : ov.classList.contains('show');
}
function fecharPainel(id){
  const ov=document.getElementById(id);
  if(!ov) return;
  if(isDocked()) ov.classList.add('collapsed');
  else ov.classList.remove('show');
}
function abrirPainel(id){
  cancelarAutoAvanco();
  const ov=document.getElementById(id);
  if(isDocked()) ov.classList.remove('collapsed');
  else ov.classList.add('show');
  atualizarBotoes();
}
function atualizarBotoes(){
  const ov=document.getElementById('manualOverlay'), btn=document.getElementById('manualBtn');
  if(!ov||!btn) return;
  btn.style.display = estaAberto('manualOverlay') ? 'none' : '';
}
function abrirManual(){
  abrirPainel('manualOverlay');
  const pdf=document.getElementById('manualPdf');
  if(pdf && !pdf.getAttribute('src')) pdf.setAttribute('src', '../data/codigo-etica-cfess.pdf');
}
function fecharManual(){ fecharPainel('manualOverlay'); atualizarBotoes(); }
function alternarManual(){ if(estaAberto('manualOverlay')) fecharManual(); else abrirPainel('manualOverlay'); }
function alternarFases(){
  const dd=document.getElementById('fasesDropdown');
  if(dd) dd.classList.toggle('show');
}
document.addEventListener('click', e=>{
  const dd=document.getElementById('fasesDropdown');
  const btn=document.getElementById('chromeToggle');
  if(dd && dd.classList.contains('show') && !dd.contains(e.target) && e.target!==btn){
    dd.classList.remove('show');
  }
});
window.addEventListener('resize', atualizarBotoes);


/* ---------- init ---------- */
Promise.all([
  fetch('../data/codigo-etica.json').then(r=>r.json()),
  fetch('../data/lei8662.json').then(r=>r.json())
]).then(([etica, lei])=>{
  DATA={
    principios: etica.principios_fundamentais,
    artigosEtica: etica.artigos,
    lei8662: lei.artigos
  };
  startRound();
  atualizarBotoes();
}).catch(()=>{ $('activity').textContent='não foi possível carregar as questões.'; });
</script>
<div class="manual-overlay" id="manualOverlay" onclick="if(event.target===this) fecharManual()">
  <div class="manual-panel">
    <div class="manual-head">
      <button class="manual-close" onclick="fecharManual()" aria-label="fechar">×</button>
    </div>
    <iframe class="manual-pdf" id="manualPdf" title="Código de Ética do/a Assistente Social (PDF oficial CFESS)"></iframe>
  </div>
</div>
</div>
</body>
</html>
