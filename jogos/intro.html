<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SENTA A CARIMBADA, camarada!</title>
<link rel="stylesheet" href="./carimbo.css">
<style>
  body.intro-body{
    overflow:hidden;height:100vh;padding:0;
    display:flex;align-items:center;justify-content:center;
  }
  /* na intro, sem o papel de parede de memes tiled — só o gradiente escuro por baixo */
  body.intro-body::before{ display:none; }

  .intro-stage{ position:relative; text-align:center; padding:0 24px; cursor:pointer; }

  .intro-title{
    font-family:'Agitprop',"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    font-size:clamp(40px,9vw,84px);line-height:1.05;font-weight:400;
    color:#c1554a;margin:0;
  }
  .intro-title .palavra{
    display:inline-block;opacity:0;transform:scale(2) rotate(-6deg);
    text-shadow:
      1px 1px 0 var(--ink-deep),2px 2px 0 var(--ink-deep),3px 3px 0 var(--ink-deep),
      4px 4px 0 var(--ink-deep),5px 5px 0 var(--ink-deep),6px 6px 0 var(--ink-deep),
      7px 7px 0 var(--ink-deep),8px 8px 0 var(--ink-deep);
  }
  .intro-title .palavra.show{ animation:baque .38s cubic-bezier(.2,1.4,.4,1) forwards; }
  @keyframes baque{
    0%{opacity:0;transform:scale(2) rotate(-6deg)}
    60%{opacity:1}
    100%{opacity:1;transform:scale(1) rotate(-1deg)}
  }
  .intro-title .camarada{
    font-family:'Minhaletra2',"Helvetica Neue",Arial,sans-serif;
    text-shadow:none;font-size:1.1em;
  }
  .intro-title .camarada.show{ animation:assina .5s ease forwards; }
  @keyframes assina{
    0%{opacity:0;transform:scale(1.3) rotate(-3deg)}
    100%{opacity:1;transform:scale(1) rotate(-1deg)}
  }

  .intro-continuar{
    margin-top:30px;opacity:0;
    font-family:'Bangalore',"Helvetica Neue",Arial,sans-serif;
    letter-spacing:.12em;text-transform:uppercase;
    color:var(--paper-2);font-size:13px;
  }
  .intro-continuar.show{ animation:fade .5s ease forwards; }
  @keyframes fade{ from{opacity:0} to{opacity:1} }

  .intro-logo-stamp{
    position:fixed;top:50%;left:50%;z-index:45;
    width:min(200px,42vw);height:auto;
    transform:translate(-50%,-50%) rotate(-14deg) scale(1.8);
    opacity:0;pointer-events:none;
  }
  .intro-logo-stamp.show{ animation:logoStamp .45s cubic-bezier(.2,1.4,.4,1) forwards; }
  @keyframes logoStamp{
    0%{opacity:0;transform:translate(-50%,-50%) rotate(-14deg) scale(1.8)}
    60%{opacity:1}
    100%{opacity:.95;transform:translate(-50%,-50%) rotate(-8deg) scale(1)}
  }

  @media (prefers-reduced-motion: reduce){
    .intro-title .palavra, .intro-title .camarada{ animation:none !important; opacity:1 !important; transform:none !important; }
    .intro-continuar{ animation:none !important; }
    .intro-logo-stamp.show{ animation:none !important; opacity:.95 !important; transform:translate(-50%,-50%) rotate(-8deg) scale(1) !important; }
  }
</style>
</head>
<body class="intro-body">

<div class="intro-stage" id="introStage">
  <h1 class="intro-title" id="introTitle">
    <span class="palavra">SENTA</span>
    <span class="palavra"> A</span>
    <span class="palavra"> CARIMBADA,</span>
    <span class="palavra camarada"> camarada!</span>
  </h1>

  <div class="intro-continuar" id="introContinuar">toque pra continuar →</div>
</div>

<img class="intro-logo-stamp" id="introLogoStamp" src="../logo.png" alt="">

<script>
/* Timestamps reais extraídos do Theme.ogg (análise de picos de energia — ~100 BPM,
   batida a cada ~0.6s). O título bate junto com as 4 primeiras batidas da faixa. */
const BEATS = [650, 1250, 1840, 2440];
const CONTINUAR_EM = 5460; // próximo acento musical (fim da 1a frase)

const titulo = document.getElementById('introTitle');
const palavras = titulo.querySelectorAll('.palavra');

const MUSICA_POS_KEY = 'carimbo.musica.pos'; // mesma chave lida pelo musica.js nas outras páginas

const musica = new Audio('../Theme.ogg');
musica.volume = 0.35;
musica.play().catch(()=>{
  // autoplay bloqueado pelo navegador: retoma assim que o jogador interagir com a página
  const retomar = ()=>{ musica.play().catch(()=>{}); };
  document.addEventListener('pointerdown', retomar, { once:true });
  document.addEventListener('keydown', retomar, { once:true });
});

// salva a posição continuamente pra a próxima página (mesa.html) continuar dali, em vez de reiniciar
musica.addEventListener('timeupdate', ()=>{
  try{ localStorage.setItem(MUSICA_POS_KEY, String(musica.currentTime)); }catch(e){}
});

BEATS.forEach((t, i) => {
  setTimeout(() => {
    const p = palavras[i];
    if(p) p.classList.add('show');
  }, t);
});

setTimeout(() => {
  document.getElementById('introContinuar').classList.add('show');
}, CONTINUAR_EM);

let saindo = false;
function avancar(){
  if(saindo) return;
  saindo = true;

  document.getElementById('introLogoStamp').classList.add('show');
  try{
    const stamp = new Audio('../stamp.mp3');
    stamp.play().catch(()=>{});
  }catch(e){}
  try{ localStorage.setItem(MUSICA_POS_KEY, String(musica.currentTime)); }catch(e){}

  setTimeout(() => {
    window.location.href = './mesa.html';
  }, 550);
}

document.getElementById('introStage').addEventListener('pointerdown', avancar);
document.addEventListener('keydown', e => {
  if(e.key === 'Tab') return;
  avancar();
});
</script>
</body>
</html>
