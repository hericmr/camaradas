<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SENTA A CARIMBADA, camarada!</title>
<link rel="stylesheet" href="./carimbo.css">
<style>
  body.intro-body{
    overflow:hidden;height:100vh;padding:0;
    display:flex;align-items:center;justify-content:center;
    background:#000;background-image:none;
  }
  /* na intro, sem o papel de parede de memes tiled e sem o gradiente escuro — fundo todo preto */
  body.intro-body::before{ display:none; }

  .intro-stage{ position:relative; text-align:center; padding:0 24px; cursor:pointer; }

  .intro-tap{
    display:none;
    font-family:'Bangalore',"Helvetica Neue",Arial,sans-serif;
    letter-spacing:.14em;text-transform:uppercase;
    color:var(--paper-2);font-size:14px;
    animation:piscar 1.4s ease-in-out infinite;
  }
  .intro-tap.show{ display:block; }
  @keyframes piscar{ 0%,100%{opacity:.4} 50%{opacity:1} }

  .intro-title{
    font-family:'Agitprop',"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    font-size:clamp(40px,9vw,84px);line-height:1.05;font-weight:400;
    color:#a8a8a8;margin:0;
  }
  .intro-title .palavra{
    display:inline-block;opacity:0;transform:scale(2) rotate(-6deg);
    text-shadow:
      1px 1px 0 #fff,2px 2px 0 #fff,3px 3px 0 #fff,
      4px 4px 0 #fff,5px 5px 0 #fff,6px 6px 0 #fff,
      7px 7px 0 #fff,8px 8px 0 #fff;
  }
  .intro-title .palavra.show{ animation:baque .38s cubic-bezier(.2,1.4,.4,1) forwards; }
  @keyframes baque{
    0%{opacity:0;transform:scale(2) rotate(-6deg)}
    60%{opacity:1}
    100%{opacity:1;transform:scale(1) rotate(-1deg)}
  }
  .intro-title .camarada{
    font-family:'Minhaletra2',"Helvetica Neue",Arial,sans-serif;
    text-shadow:none;font-size:1.1em;
  }
  .intro-title .camarada.show{ animation:assina .5s ease forwards; }
  @keyframes assina{
    0%{opacity:0;transform:scale(1.3) rotate(-3deg)}
    100%{opacity:1;transform:scale(1) rotate(-1deg)}
  }

  .intro-continuar{
    margin-top:30px;opacity:0;
    font-family:'Bangalore',"Helvetica Neue",Arial,sans-serif;
    letter-spacing:.12em;text-transform:uppercase;
    color:var(--paper-2);font-size:13px;
  }
  .intro-continuar.show{ animation:fade .5s ease forwards; }
  @keyframes fade{ from{opacity:0} to{opacity:1} }

  .intro-carimbador{
    display:block;margin:22px auto 0;max-width:150px;height:auto;
    opacity:0;transform:translateY(60px);
  }
  .intro-carimbador.show{ animation:subirCarimbo .5s cubic-bezier(.2,1.4,.4,1) forwards; }
  @keyframes subirCarimbo{
    0%{opacity:0;transform:translateY(60px)}
    100%{opacity:1;transform:translateY(0)}
  }
  /* bate o carimbo quando o jogador toca pra começar; mantém a posição final da entrada */
  .intro-carimbador.hit{ animation:carimboHit .3s ease forwards; }
  @keyframes carimboHit{
    0%{transform:translateY(0) scale(1) rotate(0)}
    40%{transform:translateY(0) scale(1.12) rotate(-4deg)}
    100%{transform:translateY(0) scale(1) rotate(0)}
  }

  .intro-logo-stamp{
    position:fixed;top:50%;left:50%;z-index:45;
    width:min(200px,42vw);height:auto;
    transform:translate(-50%,-50%) rotate(-14deg) scale(1.8);
    opacity:0;pointer-events:none;
  }
  .intro-logo-stamp.show{ animation:logoStamp .45s cubic-bezier(.2,1.4,.4,1) forwards; }
  @keyframes logoStamp{
    0%{opacity:0;transform:translate(-50%,-50%) rotate(-14deg) scale(1.8)}
    60%{opacity:1}
    100%{opacity:.95;transform:translate(-50%,-50%) rotate(-8deg) scale(1)}
  }

  @media (prefers-reduced-motion: reduce){
    .intro-title .palavra, .intro-title .camarada{ animation:none !important; opacity:1 !important; transform:none !important; }
    .intro-continuar{ animation:none !important; }
    .intro-logo-stamp.show{ animation:none !important; opacity:.95 !important; transform:translate(-50%,-50%) rotate(-8deg) scale(1) !important; }
    .intro-tap{ animation:none !important; opacity:1 !important; }
    .intro-carimbador{ animation:none !important; opacity:1 !important; transform:none !important; }
  }
</style>
</head>
<body class="intro-body">

<div class="intro-stage" id="introStage">
  <div class="intro-tap" id="introTap">toque pra começar, camarada</div>

  <h1 class="intro-title" id="introTitle">
    <span class="palavra">SENTA</span>
    <span class="palavra"> A</span>
    <span class="palavra"> CARIMBADA,</span>
    <span class="palavra camarada"> camarada!</span>
  </h1>

  <img class="intro-carimbador" id="introCarimbador" src="../img/carimbo/01.png" alt="assistente social de carimbo em punho, pronto para julgar">

  <div class="intro-continuar" id="introContinuar">toque pra continuar →</div>
</div>

<img class="intro-logo-stamp" id="introLogoStamp" src="../logo.png" alt="">

<script>
/* Timestamps reais extraídos do Theme.ogg (análise de picos de energia — ~100 BPM,
   batida a cada ~0.6s). O título bate junto com as 4 primeiras batidas da faixa. */
const BEATS_DESKTOP = [650, 1250, 1840, 2440];
const CONTINUAR_DESKTOP = 5460; // próximo acento musical (fim da 1a frase)

/* Em telas pequenas cada palavra ocupa a largura toda e demora mais pra ler,
   então usa só as batidas alternadas (~1,2s entre elas, ainda batidas reais
   da faixa) em vez de uma a cada ~0,6s. */
const BEATS_MOBILE = [650, 1840, 3050, 4230];
const CONTINUAR_MOBILE = 5450;

const EH_MOBILE = window.matchMedia('(max-width:560px)').matches;
const BEATS = EH_MOBILE ? BEATS_MOBILE : BEATS_DESKTOP;
const CONTINUAR_EM = EH_MOBILE ? CONTINUAR_MOBILE : CONTINUAR_DESKTOP;

const titulo = document.getElementById('introTitle');
const palavras = titulo.querySelectorAll('.palavra');

const MUSICA_POS_KEY = 'carimbo.musica.pos'; // mesma chave lida pelo musica.js nas outras páginas

const musica = new Audio('../Theme.ogg');
musica.volume = 0.35;

// salva a posição continuamente pra a próxima página (mesa.html) continuar dali, em vez de reiniciar
musica.addEventListener('timeupdate', ()=>{
  try{ localStorage.setItem(MUSICA_POS_KEY, String(musica.currentTime)); }catch(e){}
});

// o título só bate depois que a música realmente começa a tocar, pra ficar no ritmo de verdade
// (em celular o navegador quase sempre bloqueia esse primeiro play() sem toque do jogador)
let sequenciaIniciada = false;
function iniciarSequencia(){
  if(sequenciaIniciada) return;
  sequenciaIniciada = true;

  BEATS.forEach((t, i) => {
    setTimeout(() => {
      const p = palavras[i];
      if(p) p.classList.add('show');
    }, t);
  });

  setTimeout(() => {
    document.getElementById('introContinuar').classList.add('show');
    document.getElementById('introCarimbador').classList.add('show');
  }, CONTINUAR_EM);
}

let aguardandoToque = false;
musica.play().then(iniciarSequencia).catch(()=>{
  aguardandoToque = true;
  document.getElementById('introTap').classList.add('show');
});

function desbloquear(){
  aguardandoToque = false;
  document.getElementById('introTap').classList.remove('show');
  musica.play().catch(()=>{});
  iniciarSequencia();
}

let saindo = false;
function avancar(){
  if(saindo) return;
  saindo = true;

  document.getElementById('introLogoStamp').classList.add('show');
  const carimbador = document.getElementById('introCarimbador');
  carimbador.src = '../img/carimbo/02.png';
  carimbador.classList.add('hit');
  try{
    const stamp = new Audio('../stamp.mp3');
    stamp.play().catch(()=>{});
  }catch(e){}
  try{ localStorage.setItem(MUSICA_POS_KEY, String(musica.currentTime)); }catch(e){}

  setTimeout(() => {
    window.location.href = './mesa.html';
  }, 550);
}

function aoInteragir(){
  if(aguardandoToque){ desbloquear(); return; }
  avancar();
}

document.getElementById('introStage').addEventListener('pointerdown', aoInteragir);
document.addEventListener('keydown', e => {
  if(e.key === 'Tab') return;
  aoInteragir();
});
</script>
</body>
</html>
