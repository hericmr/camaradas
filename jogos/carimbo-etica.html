<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SENTA A CARIMBADA, camarada! · código de ética (direito, dever ou vedação)</title>
<style>
  .stamp-btn.green{border-color:var(--seal-green);color:var(--seal-green-ink)}
  .stamp-btn.green:hover{background:rgba(47,107,79,.08)}
  .stamp-btn.gold{border-color:var(--seal-gold);color:var(--seal-gold-ink)}
  .stamp-btn.gold:hover{background:rgba(168,132,60,.1)}
  .stamp-btn.red{border-color:var(--seal-red);color:var(--seal-red-ink)}
  .stamp-btn.red:hover{background:rgba(168,50,42,.08)}
  .seal.green{color:var(--seal-green)}
  .seal.gold{color:var(--seal-gold)}
  .seal.red{color:var(--seal-red)}
</style>
  <link rel="stylesheet" crossorigin href="/camaradas/assets/carimbo-UJtDOi0e.css">
</head>
<body class="bg-2">
  <div class="game-navbar">
    <a class="back-link" href="../index.html">&larr; início</a>
    <span class="game-navbar-title">SENTA A CARIMBADA, <span class="camarada">camarada!</span></span>
    <div class="navbar-fases">
      <button class="chrome-toggle" id="chromeToggle" onclick="alternarFases()">fases</button>
      <div class="fases-dropdown" id="fasesDropdown">
        <nav class="fases" id="fasesNav"></nav>
      </div>
    </div>
  </div>
<div class="desk">
<div class="desk-game">
<div class="wrap">
  <!-- ===== MODO JOGO ===== -->
  <section class="stage" id="playStage">
    <div class="card" id="card" data-label="CÓDIGO DE ÉTICA">
      <div class="doc-label" id="docLabel">Documento nº 1: classifique a atividade</div>
      <div class="activity" id="activity">…</div>

      <div class="carimbador-row">
        <div class="hud-side">
          <div class="stat"><div class="k">Acertos</div><div class="v" id="hCorrect">0</div></div>
          <div class="stat streak"><div class="k">Sequência</div><div class="v" id="hStreak">0</div></div>
        </div>
        <img class="carimbador" id="carimbador" src="../img/carimbo/01.png" alt="assistente social de carimbo em punho, pronto para julgar">
        <div class="hud-side">
          <div class="stat"><div class="k">Rodada</div><div class="v" id="hProg">0/0</div></div>
          <div class="stat"><div class="k">Recorde</div><div class="v" id="hBest">0</div></div>
        </div>
      </div>

      <div class="seal green" id="sealDireito">Direito</div>
      <div class="seal gold" id="sealDever">Dever</div>
      <div class="seal red" id="sealVedacao">Vedação</div>

      <div class="verdict c3 odd">
        <button class="stamp-btn green" id="btnDireito" onclick="judge('direito')">
          <span class="nat">Direito</span>
        </button>
        <button class="stamp-btn gold" id="btnDever" onclick="judge('dever')">
          <span class="nat">Dever</span>
        </button>
        <button class="stamp-btn red" id="btnVedacao" onclick="judge('vedacao')">
          <span class="nat">Vedação</span>
        </button>
      </div>

      <div class="feedback" id="feedback">
        <div class="verdict-line" id="vLine"></div>
        <div class="cite" id="cite"></div>
      </div>
    </div>
  </section>
</div>
  <div class="foot">Fonte: <a href="https://www.cfess.org.br/arquivos/CEP_CFESS-SITE.pdf" target="_blank" rel="noopener">Código de Ética do/a Assistente Social, Resolução CFESS nº 273, de 13 de março de 1993 (PDF oficial)</a></div>
</div>

<script src="./progresso.js"></script>
<script src="./musica.js"></script>
<script>
let DATA = null;
carimboRenderizarDropdownFase('etica');

const NAT = {
  direito: {label:'Direito', explica:'é um <b>direito</b> do/a assistente social: pode exercer, não é obrigatório.'},
  dever: {label:'Dever', explica:'é um <b>dever</b> do/a assistente social: obrigação a cumprir.'},
  vedacao: {label:'Vedação', explica:'é uma <b>vedação</b>: proibido ao/à assistente social.'}
};
const SEAL_ID = {direito:'sealDireito', dever:'sealDever', vedacao:'sealVedacao'};
const BTN_ID = {direito:'btnDireito', dever:'btnDever', vedacao:'btnVedacao'};

/* ---------- monta o baralho ---------- */
function buildDeck(){
  const deck=[];
  Object.values(DATA.artigos).forEach(a=>{
    if(!NAT[a.natureza]) return;
    if(a.alineas && a.alineas.length){
      a.alineas.forEach(al=>{
        deck.push({art:a.num, letra:al.letra, natureza:a.natureza, texto:al.texto});
      });
    } else {
      deck.push({art:a.num, letra:null, natureza:a.natureza, texto:a.caput});
    }
  });
  return deck;
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

let deck=[], idx=0, correct=0, streak=0, best=0, answered=false, missed=[];

const $=id=>document.getElementById(id);

const sndStamp=new Audio('../stamp.mp3');
const sndCorrect=new Audio('../correct.mp3');
const sndWrong=new Audio('../wrong.mp3');
function playSound(a){
  try{ a.currentTime=0; a.play().catch(()=>{}); }catch(e){}
}

/* ---------- avanço automático ---------- */
let autoAdvanceTimer=null;
let spaceAdvanceActive=false;

document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ fecharManual(); const dd=document.getElementById('fasesDropdown'); if(dd) dd.classList.remove('show'); return; }
  const tag=(e.target&&e.target.tagName)||'';
  if(tag==='INPUT' || tag==='TEXTAREA') return;
  if(e.code==='Space' || e.key===' '){
    if(spaceAdvanceActive){
      e.preventDefault();
      avancarQuestao();
    }
  }
});

function agendarProximo(){
  cancelarAutoAvanco();
  const fill=$('nextFill');
  if(fill){
    fill.classList.remove('run');
    void fill.offsetWidth;
    fill.classList.add('run');
  }
  spaceAdvanceActive=true;
  autoAdvanceTimer=setTimeout(avancarQuestao, 3000);
}

function cancelarAutoAvanco(){
  if(autoAdvanceTimer){ clearTimeout(autoAdvanceTimer); autoAdvanceTimer=null; }
  spaceAdvanceActive=false;
  const fill=$('nextFill');
  if(fill) fill.classList.remove('run');
}

function avancarQuestao(){
  cancelarAutoAvanco();
  nextCard();
}

function startRound(){
  cancelarAutoAvanco();
  deck=shuffle(buildDeck());
  idx=0; correct=0; streak=0; answered=false; missed=[];
  renderCard(); updateHud();
}

function renderCard(){
  answered=false;
  const c=deck[idx];
  $('card').innerHTML=cardTemplate();
  bindCard();
  $('docLabel').textContent=`Documento nº ${idx+1}: classifique a atividade`;
  $('activity').innerHTML=`<span class="qnum">“</span>${c.texto}<span class="qnum">”</span>`;
  updateHud();
}

function cardTemplate(){
  return `
    <div class="doc-label" id="docLabel"></div>
    <div class="activity" id="activity"></div>
    <div class="carimbador-row">
      <div class="hud-side">
        <div class="stat"><div class="k">Acertos</div><div class="v" id="hCorrect">0</div></div>
        <div class="stat streak"><div class="k">Sequência</div><div class="v" id="hStreak">0</div></div>
      </div>
      <img class="carimbador" id="carimbador" src="../img/carimbo/01.png" alt="assistente social de carimbo em punho, pronto para julgar">
      <div class="hud-side">
        <div class="stat"><div class="k">Rodada</div><div class="v" id="hProg">0/0</div></div>
        <div class="stat"><div class="k">Recorde</div><div class="v" id="hBest">0</div></div>
      </div>
    </div>
    <div class="seal green" id="sealDireito">Direito</div>
    <div class="seal gold" id="sealDever">Dever</div>
    <div class="seal red" id="sealVedacao">Vedação</div>
    <div class="verdict c3 odd">
      <button class="stamp-btn green" id="btnDireito"><span class="nat">Direito</span></button>
      <button class="stamp-btn gold" id="btnDever"><span class="nat">Dever</span></button>
      <button class="stamp-btn red" id="btnVedacao"><span class="nat">Vedação</span></button>
    </div>
    <div class="feedback" id="feedback">
      <div class="verdict-line" id="vLine"></div>
      <div class="cite" id="cite"></div>
    </div>`;
}
function bindCard(){
  $('btnDireito').onclick=()=>judge('direito');
  $('btnDever').onclick=()=>judge('dever');
  $('btnVedacao').onclick=()=>judge('vedacao');
}

function judge(choice){
  if(answered) return;
  answered=true;
  playSound(sndStamp);
  const c=deck[idx];
  const right = choice===c.natureza;
  const info = NAT[c.natureza];

  // estampa o selo correto
  $(SEAL_ID[c.natureza]).classList.add('show');

  // bate o carimbo
  const carimbador=$('carimbador');
  carimbador.src='../img/carimbo/02.png';
  carimbador.classList.add('hit');
  setTimeout(()=>carimbador.classList.remove('hit'),150);

  const local = c.letra ? `alínea <b>${c.letra}</b> do art. <b>${c.art}</b>` : `art. <b>${c.art}</b>`;

  if(right){ correct++; streak++; if(streak>best){best=streak;} playSound(sndCorrect); }
  else { streak=0; missed.push({ref:local, texto:c.texto, explica:info.explica}); playSound(sndWrong); }

  const rotuloProximo = idx>=deck.length-1 ? 'Ver resultado →' : 'Próximo →';
  Object.keys(BTN_ID).forEach(cat=>{
    const btn=$(BTN_ID[cat]);
    if(cat===choice){
      btn.disabled=false;
      btn.classList.add('next-here');
      btn.onclick=avancarQuestao;
      btn.innerHTML=`<span class="next-fill" id="nextFill"></span><span class="next-label">${rotuloProximo}</span>`;
    } else {
      btn.disabled=true;
    }
  });

  const fb=$('feedback');
  const vLine=$('vLine');
  const cite=$('cite');
  vLine.className='verdict-line '+(right?'ok':'no');
  vLine.textContent = right ? '✓ Carimbo correto' : '✗ Carimbo errado';
  cite.innerHTML = `${local}: ${info.explica}`;
  fb.classList.add('show');
  updateHud();

  agendarProximo();
}

function nextCard(){
  if(idx>=deck.length-1){ showDone(); return; }
  idx++; renderCard();
}

function updateHud(){
  $('hCorrect').textContent=correct;
  $('hProg').textContent=`${Math.min(idx+ (answered?1:0),deck.length)}/${deck.length}`;
  $('hStreak').textContent=streak;
  $('hBest').textContent=best;
}

function reviewHtml(){
  if(!missed.length) return '';
  return `<div class="review">
    <h3>Revise o que errou (${missed.length})</h3>
    <ul>${missed.map(m=>`<li><div class="r-cite">${m.ref}: ${m.explica}</div><div class="r-txt">“${m.texto}”</div></li>`).join('')}</ul>
  </div>`;
}

function showDone(){
  const pct=Math.round(correct/deck.length*100);
  carimboSalvarProgresso('etica', correct, deck.length, best);
  let msg;
  if(pct===100) msg="Gabaritou. Você domina direito, dever e vedação.";
  else if(pct>=80) msg="Sólido. Revise só as alíneas que escaparam.";
  else if(pct>=60) msg="Quase lá. Revise os errados abaixo e tente de novo.";
  else msg="Revise os errados abaixo antes de tentar de novo.";
  $('playStage').innerHTML=`
    <div class="card"><div class="done">
      <div class="score-big">${correct}/${deck.length}</div>
      <h2>${pct}% de acerto</h2>
      <p>${msg}${best>1?`<br>Melhor sequência: ${best} seguidos.`:''}</p>
      <button onclick="restart()">Nova rodada</button>
    </div>${reviewHtml()}</div>`;
}
function restart(){
  $('playStage').innerHTML=`<div class="card" id="card" data-label="CÓDIGO DE ÉTICA"></div>`;
  startRound();
}

/* ---------- paineis dock: manual (lei seca) e fases ---------- */
function isDocked(){
  return window.matchMedia('(min-width:1100px)').matches;
}
function estaAberto(id){
  const ov=document.getElementById(id);
  if(!ov) return false;
  return isDocked() ? !ov.classList.contains('collapsed') : ov.classList.contains('show');
}
function fecharPainel(id){
  const ov=document.getElementById(id);
  if(!ov) return;
  if(isDocked()) ov.classList.add('collapsed');
  else ov.classList.remove('show');
}
function abrirPainel(id){
  cancelarAutoAvanco();
  const ov=document.getElementById(id);
  if(isDocked()) ov.classList.remove('collapsed');
  else ov.classList.add('show');
  atualizarBotoes();
}
function atualizarBotoes(){
  const ov=document.getElementById('manualOverlay'), btn=document.getElementById('manualBtn');
  if(!ov||!btn) return;
  btn.style.display = estaAberto('manualOverlay') ? 'none' : '';
}
function abrirManual(){
  abrirPainel('manualOverlay');
  const pdf=document.getElementById('manualPdf');
  if(pdf && !pdf.getAttribute('src')) pdf.setAttribute('src', '../data/codigo-etica-cfess.pdf');
}
function fecharManual(){ fecharPainel('manualOverlay'); atualizarBotoes(); }
function alternarManual(){ if(estaAberto('manualOverlay')) fecharManual(); else abrirPainel('manualOverlay'); }
function alternarFases(){
  const dd=document.getElementById('fasesDropdown');
  if(dd) dd.classList.toggle('show');
}
document.addEventListener('click', e=>{
  const dd=document.getElementById('fasesDropdown');
  const btn=document.getElementById('chromeToggle');
  if(dd && dd.classList.contains('show') && !dd.contains(e.target) && e.target!==btn){
    dd.classList.remove('show');
  }
});
window.addEventListener('resize', atualizarBotoes);


/* ---------- init ---------- */
fetch('../data/codigo-etica.json')
  .then(r=>r.json())
  .then(json=>{
    DATA={artigos:json.artigos};
    startRound();
    atualizarBotoes();
  })
  .catch(()=>{ $('activity').textContent='não foi possível carregar as questões.'; });
</script>
<button class="music-btn" id="musicaBtn" onclick="alternarMusica()" aria-pressed="false">tocar música</button>
<button class="manual-btn" id="manualBtn" onclick="alternarManual()">consultar a lei</button>
<div class="manual-overlay" id="manualOverlay" onclick="if(event.target===this) fecharManual()">
  <div class="manual-panel">
    <div class="manual-head">
      <button class="manual-close" onclick="fecharManual()" aria-label="fechar">×</button>
    </div>
    <iframe class="manual-pdf" id="manualPdf" title="Código de Ética do/a Assistente Social (PDF oficial CFESS)"></iframe>
  </div>
</div>
</div>
</body>
</html>
